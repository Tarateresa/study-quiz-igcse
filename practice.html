<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Practice | IGCSE Study Hub</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <strong id="practiceTitle">Practice Mode</strong>
        <span class="mono" id="syllabel">Syllabus 2026–2028</span>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <a href="progress.html">Progress</a>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"></button>
        <button onclick="doLogout()">Logout</button>
      </nav>
    </header>

    <div class="progress-wrap">
      <div class="progress-top">
        <strong id="progressTitle">Your progress</strong>
        <span class="small" id="progText">Loading...</span>
      </div>
      <div class="bar"><div id="bar"></div></div>
    </div>

    <div style="height:16px;"></div>

    <div class="question-box">
      <div class="question-meta">
        <span class="topic-pill" id="topicLine">Topic</span>
        <span class="difficulty-pill" id="difficultyLine">Difficulty</span>
      </div>
      <h2 id="qPrompt">Question</h2>
      <div id="choices"></div>

      <div class="btn-row" style="margin-top:18px;">
        <button id="submitBtn" class="btn-primary" onclick="submitAnswer()">Submit Answer</button>
        <button id="skipBtn" onclick="skip()">Skip</button>
        <a href="progress.html">Review mistakes</a>
      </div>

      <div id="feedback" class="feedback"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="google-config.js"></script>
  <script src="app.js"></script>
  <script>
    const url = new URL(location.href);
    const subjectKey = url.searchParams.get("subject");
    let session = null;
    let user = null;
    let subject = null;
    let list = null;
    let idx = 0;
    let isReviewMode = false;
    let selected = null;
    let answered = false;

    async function init(){
      session = await getSession();
      if(!session){
        alert("Please login first.");
        location.href="login.html";
        return;
      }
      user = session.user;
      subject = window.SUBJECTS[subjectKey];
      list = window.QUESTIONS[subjectKey];
      if(!subject || !list){
        location.href = "index.html";
        return;
      }

      await ensureUserProgress(user.id);
      const reviewParam = url.searchParams.get("review");
      isReviewMode = reviewParam !== null;
      const p = await progressForSubject(user.id, subjectKey);
      idx = reviewParam !== null
        ? Math.max(0, Math.min(Number(reviewParam), list.length - 1))
        : Math.min(p.idx || 0, list.length);

      document.getElementById("practiceTitle").textContent = `${subject.name} Practice`;
      document.getElementById("syllabel").textContent = `Syllabus: ${subject.syllabus}`;
      document.getElementById("progressTitle").textContent = isReviewMode ? `${subject.name} • Review` : `${subject.name} progress`;
      render();
    }

    async function render(){
      const qPrompt = document.getElementById("qPrompt");
      const choicesEl = document.getElementById("choices");
      const feedback = document.getElementById("feedback");
      const submitBtn = document.getElementById("submitBtn");
      const skipBtn = document.getElementById("skipBtn");

      if(idx >= list.length){
        document.getElementById("topicLine").textContent = "Complete";
        document.getElementById("difficultyLine").textContent = "🎉 Finished";
        qPrompt.textContent = "You finished this set!";
        choicesEl.innerHTML = `<div class="empty-state"><strong>Great work.</strong><br>Open Progress to review your accuracy and the questions you missed.</div>`;
        feedback.className = "feedback show good";
        feedback.textContent = "All questions in this set have been attempted.";
        submitBtn.classList.add("hidden");
        skipBtn.classList.add("hidden");
        await updateProgressUI();
        return;
      }

      const q = list[idx];
      selected = null;
      answered = false;
      feedback.className = "feedback";
      feedback.textContent = "";
      submitBtn.textContent = "Submit Answer";
      submitBtn.classList.remove("hidden");
      skipBtn.classList.remove("hidden");
      document.getElementById("topicLine").textContent = q.topic;
      document.getElementById("difficultyLine").textContent = `Difficulty ${q.difficulty}`;
      qPrompt.textContent = q.prompt;
      choicesEl.innerHTML = "";

      q.options.forEach((opt, i)=>{
        const id = `c_${i}`;
        const label = document.createElement("label");
        label.className = "choice";
        label.setAttribute("for", id);
        label.innerHTML = `
          <input type="radio" name="answer" id="${id}" value="${i}">
          <span class="choice-letter">${String.fromCharCode(65+i)}</span>
          <span class="choice-text">${opt}</span>
        `;
        label.onclick = () => selectChoice(i);
        choicesEl.appendChild(label);
      });

      await updateProgressUI();
    }

    function selectChoice(i){
      if(answered) return;
      selected = i;
      document.querySelectorAll(".choice").forEach((choice, index)=>{
        choice.classList.toggle("selected", index === i);
        const radio = choice.querySelector("input");
        radio.checked = index === i;
      });
    }

    async function submitAnswer(){
      if(idx >= list.length) return;

      if(answered){
        if(isReviewMode){ location.href = "progress.html"; return; }
        const p = await progressForSubject(user.id, subjectKey);
        idx = p.idx;
        await render();
        window.scrollTo({top:0, behavior:"smooth"});
        return;
      }

      if(selected === null){
        const feedback = document.getElementById("feedback");
        feedback.className = "feedback show bad";
        feedback.textContent = "Please choose an option first.";
        return;
      }

      const q = list[idx];
      const isCorrect = selected === q.answerIndex;
      if(!isReviewMode){
        try { await updateProgress(user.id, subjectKey, idx, selected, isCorrect, false); }
        catch(error){
          console.error(error);
          const feedback = document.getElementById("feedback");
          feedback.className = "feedback show bad";
          feedback.textContent = "We couldn't save your answer. Please check your connection and try again.";
          return;
        }
      }
      answered = true;

      document.querySelectorAll(".choice").forEach((choice, i)=>{
        choice.classList.add("disabled");
        if(i === q.answerIndex) choice.classList.add("correct");
        if(i === selected && !isCorrect) choice.classList.add("wrong");
      });

      const feedback = document.getElementById("feedback");
      feedback.className = `feedback show ${isCorrect ? "good" : "bad"}`;
      feedback.textContent = isCorrect
        ? "Correct! Nice work."
        : `Not quite. The correct answer is ${String.fromCharCode(65 + q.answerIndex)}) ${q.options[q.answerIndex]}`;

      document.getElementById("submitBtn").textContent = isReviewMode ? "Back to Progress" : "Next Question →";
      document.getElementById("skipBtn").classList.add("hidden");
      await updateProgressUI();
    }

    async function skip(){
      if(idx >= list.length || answered) return;
      const q = list[idx];
      if(!isReviewMode){
        try { await updateProgress(user.id, subjectKey, idx, null, false, true); }
        catch(error){
          console.error(error);
          const feedback = document.getElementById("feedback");
          feedback.className = "feedback show bad";
          feedback.textContent = "We couldn't save this result. Please check your connection and try again.";
          return;
        }
      }
      answered = true;

      document.querySelectorAll(".choice").forEach((choice, i)=>{
        choice.classList.add("disabled");
        if(i === q.answerIndex) choice.classList.add("correct");
      });

      const feedback = document.getElementById("feedback");
      feedback.className = "feedback show bad";
      feedback.textContent = `Skipped. The correct answer is ${String.fromCharCode(65 + q.answerIndex)}) ${q.options[q.answerIndex]}`;
      document.getElementById("submitBtn").textContent = isReviewMode ? "Back to Progress" : "Next Question →";
      document.getElementById("skipBtn").classList.add("hidden");
      await updateProgressUI();
    }

    async function updateProgressUI(){
      const p = await progressForSubject(user.id, subjectKey);
      const total = list.length;
      const pct = Math.min(100, Math.round((p.attempted / total) * 100));
      document.getElementById("bar").style.width = pct + "%";
      document.getElementById("progText").textContent = `${p.attempted} / ${total} attempted • ${p.correct} correct • ${percentCorrectFromProgress(p)}% accuracy`;
    }

    async function doLogout(){
      await logout();
      location.href="login.html";
    }

    init().catch(error => {
      console.error(error);
      alert("The Study Hub could not connect to its database. Check your Google Sheets setup.");
      location.href="login.html";
    });
  </script>
</body>
</html>
