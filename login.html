<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login | IGCSE Study Hub</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <strong>IGCSE Study Hub</strong>
        <span>Account & cloud progress</span>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"></button>
      </nav>
    </header>

    <div class="grid">
      <div class="card">
        <div class="eyebrow">Welcome back</div>
        <h1>Login</h1>
        <label class="form-label" for="loginUsername">Username</label>
        <input id="loginUsername" placeholder="Your username" autocomplete="username" maxlength="30" />
        <label class="form-label" for="loginPass">Password</label>
        <input id="loginPass" type="password"
       placeholder="Your password"
       autocomplete="current-password" />
        <div class="btn-row">
          <button class="btn-primary" onclick="doLogin()">Login</button>
          <button onclick="clearFields()">Clear</button>
        </div>
        <p id="loginMsg" class="small"></p>
      </div>

      <div class="card">
        <div class="eyebrow">New here?</div>
        <h1>Create account</h1>
        <label class="form-label" for="signUsername">Username</label>
        <input id="signUsername" placeholder="e.g. Tankhiluun" autocomplete="username" maxlength="30" />
        <label class="form-label" for="signPass">Password</label>
        <input id="signPass" type="password" placeholder="Create a password" autocomplete="new-password" minlength="6" />
        <div class="btn-row">
          <button class="btn-primary" onclick="doSignup()">Create account</button>
        </div>
        <p id="signMsg" class="small"></p>
      </div>
    </div>
  </div>

  <script src="google-config.js"></script>
  <script src="app.js"></script>
  <script>
    function clearFields(){
      ["loginUsername","loginPass","signUsername","signPass"].forEach(id=>{
        document.getElementById(id).value = "";
      });
      document.getElementById("loginMsg").textContent = "";
      document.getElementById("signMsg").textContent = "";
    }

    function show(id, txt, good=false){
      const el = document.getElementById(id);
      el.textContent = txt;
      el.style.color = good ? "var(--good)" : "var(--muted)";
    }

    async function doSignup(){
      const username = document.getElementById("signUsername").value.trim();
      const password = document.getElementById("signPass").value;
      if(!username || !password){ show("signMsg", "Please fill in all fields."); return; }
      if(password.length < 6){ show("signMsg", "Password must be at least 6 characters."); return; }
      if(!/^[a-zA-Z0-9_.-]{3,30}$/.test(username)){
        show("signMsg", "Username must be 3-30 characters and use letters, numbers, _, ., or - only."); return;
      }
      show("signMsg", "Creating your account...");
      try{
        await signup(username, password);
        show("signMsg", "Account created. Redirecting...", true);
        setTimeout(()=>location.href="index.html", 500);
      }catch(error){
        show("signMsg", error.message);
      }
    }

    async function doLogin(){
      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPass").value;
      if(!username || !password){ show("loginMsg", "Type your username and password."); return; }
      show("loginMsg", "Signing you in...");
      try{
        await login(username, password);
        show("loginMsg", "Logged in. Redirecting...", true);
        setTimeout(()=>location.href="index.html", 500);
      }catch(error){
        show("loginMsg", error.message);
      }
    }
  </script>
</body>
</html>
